# Public runner for the hourly Twitch poll. This repository holds workflow
# definitions only: every script, config, and data file lives in the private
# data repository, which is checked out here at run time and receives the
# results. Secrets are repository secrets; nothing sensitive is stored in
# this repository.
name: twitch-poll
on:
  schedule:
    - cron: "7 * * * *"   # hourly backup; an external dispatcher at :00 is the primary trigger
  workflow_dispatch: {}
env:
  DATA_REPO: rebeccajovicevic/Launch-score
jobs:
  # Backup-cron idempotency guard: stands down when the dispatched run
  # already snapshotted this hour (or is still running). Dispatched runs
  # always proceed. Fails open — worst case is a duplicate poll, never a
  # missed one.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: rebeccajovicevic/Launch-score
          token: ${{ secrets.LAUNCH_SCORE_PAT }}
          fetch-depth: 50
      - name: Decide (backup cron stands down if the hour is already polled)
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Dispatched run — guard does not apply."
            exit 0
          fi
          # GitHub cron is best-effort and drifts by up to an hour, so the
          # guard is "this UTC hour already has a snapshot", not a freshness
          # window a drifted fire would always miss.
          LAST_HOUR=$(TZ=UTC git log -1 --date=format-local:%Y-%m-%dT%H --format=%cd -- data/twitch_snapshots/ || true)
          NOW_HOUR=$(date -u +%Y-%m-%dT%H)
          if [ -n "$LAST_HOUR" ] && [ "$LAST_HOUR" = "$NOW_HOUR" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "STAND DOWN: hour $NOW_HOUR already has a snapshot commit."
            exit 0
          fi
          BUSY=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/twitch-poll.yml/runs?event=workflow_dispatch&per_page=5" \
            | python3 -c "import json,sys; rs=json.load(sys.stdin).get('workflow_runs',[]); print(sum(1 for r in rs if r.get('status') in ('queued','in_progress')))" \
            || echo 0)
          if [ "$BUSY" != "0" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "STAND DOWN: a dispatched twitch-poll run is queued/in progress."
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "BACKUP ENGAGED: no snapshot this hour and no dispatched run in flight."
  poll:
    needs: preflight
    if: needs.preflight.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Secrets sanity (fail loudly on any missing/empty secret)
        env:
          CHK_LAUNCH_SCORE_PAT: ${{ secrets.LAUNCH_SCORE_PAT }}
          CHK_TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          CHK_TWITCH_SECRET: ${{ secrets.TWITCH_SECRET }}
        run: |
          ok=1
          for v in LAUNCH_SCORE_PAT TWITCH_CLIENT_ID TWITCH_SECRET; do
            val=$(eval "printf %s \"\$CHK_$v\"")
            if [ -z "$val" ]; then
              echo "::error title=Missing secret::repository secret '$v' is EMPTY or not set in launch-score-runner — the workflow references exactly this name. Add it under Settings > Secrets and variables > Actions."
              ok=0
            fi
          done
          [ "$ok" = "1" ] || exit 1
          echo "All expected secrets present and non-empty."
      - uses: actions/checkout@v4
        with:
          repository: rebeccajovicevic/Launch-score
          token: ${{ secrets.LAUNCH_SCORE_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Poll live status
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_SECRET: ${{ secrets.TWITCH_SECRET }}
        run: python ingest/twitch_poll.py
      - name: Commit snapshots to the data repository
        run: |
          git config user.name rebeccajovicevic
          git config user.email 307259712+rebeccajovicevic@users.noreply.github.com
          git add data/twitch_snapshots/
          git commit -m "twitch snapshot $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3; do
            git push && exit 0
            git fetch origin main
            # A rebase conflict here means a concurrent poller already
            # committed this hour's snapshot rows — our duplicate sample is
            # redundant, so stand down cleanly instead of dying red.
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Concurrent snapshot landed for this hour — standing down; nothing lost."
              exit 0
            fi
            sleep 3
          done
          git push
      - name: Alert on failure (auto-issue in the data repository)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.LAUNCH_SCORE_PAT }}
        run: >
          bash .github/scripts/alert_failure.sh "${{ github.workflow }}"
          "$DATA_REPO"
          "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          "main"
